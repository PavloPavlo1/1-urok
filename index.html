<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#262421">
  <meta name="description" content="Шахи онлайн: грайте проти комп’ютера або вдвох на одному пристрої.">
  <title>Шахи</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%23b58863'/%3E%3Ctext x='50' y='76' font-size='72' text-anchor='middle' fill='%23fff'%3E%E2%99%9E%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <noscript><p style="padding:20px">Для гри потрібен увімкнений JavaScript.</p></noscript>

  <main class="app">
    <section class="board-col">
      <div class="player" id="topBar">
        <span class="pname" id="topName"></span>
        <span class="caps" id="topCaps"></span>
      </div>

      <div id="board" class="board" role="application" aria-label="Шахова дошка"></div>

      <div class="player" id="botBar">
        <span class="pname" id="botName"></span>
        <span class="caps" id="botCaps"></span>
      </div>

      <div class="status" id="status" role="status" aria-live="polite"></div>
    </section>

    <aside class="panel">
      <h1><span aria-hidden="true">♞</span> Шахи</h1>

      <div class="settings">
        <div class="mode-field"><span>Режим</span>
          <button class="btn mode-switch" id="modeBtn" type="button">Режим: Соло</button>
          <select id="mode" hidden>
            <option value="ai">Соло</option>
            <option value="local">Дуо</option>
          </select>
        </div>
        <label class="ai-only">Ваш колір
          <select id="side">
            <option value="w">Білі</option>
            <option value="b">Чорні</option>
            <option value="r">Випадково</option>
          </select>
        </label>
        <label class="ai-only">Складність
          <select id="level">
            <option value="1">Новачок</option>
            <option value="2">Середній</option>
            <option value="3">Сильний</option>
          </select>
        </label>
        <button class="btn primary" id="newBtn" type="button">Нова гра</button>
      </div>

      <div class="actions">
        <button class="btn" id="undoBtn" type="button">↶ Скасувати хід</button>
        <button class="btn ai-only" id="hintBtn" type="button">💡 Підказка</button>
      </div>

      <div class="moves-wrap">
        <h2>Ходи</h2>
        <div class="moves" id="moves"></div>
      </div>
    </aside>
  </main>

  <div class="modal" id="promo" hidden>
    <div class="dialog">
      <p>Оберіть фігуру для пішака</p>
      <div class="promo-choices" id="promoChoices"></div>
    </div>
  </div>

  <div class="modal" id="over" hidden>
    <div class="dialog">
      <h2 id="overTitle"></h2>
      <p id="overText"></p>
      <div class="dialog-actions">
        <button class="btn primary" id="overNew" type="button">Нова гра</button>
        <button class="btn" id="overClose" type="button">Закрити</button>
      </div>
    </div>
  </div>

  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
